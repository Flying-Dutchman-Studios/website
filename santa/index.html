<main>
  <svg width="96" height="96" viewBox="0 0 140 140" role="img" aria-label="Santa" style="display: block; margin: 0 auto;"><circle cx="70" cy="72" r="50" fill="#F2E3C9" /><circle cx="70" cy="78" r="28" fill="#F7D3AC" /><path d="M46 74 C38 94 44 114 70 128 C96 114 102 94 94 74 C88 90 80 98 70 98 C60 98 52 90 46 74 Z" fill="#FFFFFF" /><circle cx="56" cy="115" r="11" fill="#FFFFFF" /><circle cx="84" cy="115" r="11" fill="#FFFFFF" /><circle cx="60" cy="74" r="4" fill="#3A2418" /><circle cx="80" cy="74" r="4" fill="#3A2418" /><circle cx="70" cy="88" r="6.5" fill="#E9BC8D" /><path d="M44 56 C46 32 62 20 78 22 C96 24 106 36 108 46 C100 44 92 46 86 52 C78 50 60 50 44 56 Z" fill="#D6342A" /><rect x="40" y="52" width="62" height="14" rx="7" fill="#FFFFFF" /><circle cx="110" cy="46" r="9" fill="#FFFFFF" /></svg>

  <h1>Santa calls your child in person</h1>
  <p>You fill in what Santa knows: your child's name, a compliment and a little task. Then you hand over the phone and your child gets a real call.</p>

</main>

<script>
  // On a phone, send visitors straight to the right store: someone arriving
  // from a shared link wants to download, not read. On a computer the page
  // stays, because the store app cannot open there.
  (function () {
    var ua = navigator.userAgent || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    if (location.hash === "#stay") return;
    var iosLink = document.getElementById("ios").href;
    // While the app number is still a placeholder: keep the page.
    if (isIOS && !/id0{6,}/.test(iosLink)) location.replace(iosLink);
    else if (isAndroid) location.replace(document.getElementById("android").href);
  })();
</script>
